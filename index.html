<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>MedDuel — Medical Trivia</title>
  <meta name="description" content="Test your medical knowledge. Beat others. Get better.">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#E8410A">
  <link rel="stylesheet" href="src/styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,700;0,9..144,900;1,9..144,300&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>

  <div class="bg-shape bg-shape-1"></div>
  <div class="bg-shape bg-shape-2"></div>

  <!-- Screens are injected here by router -->
  <div id="app"></div>

  <!-- Toast & effects (always present) -->
  <div class="toast" id="toast" onclick="openFactModal()">
    <div class="toast-header">
      <div style="display:flex;align-items:center;gap:0.5rem;">
        <div class="toast-dot"></div>
        <span id="toastHead"></span>
      </div>
      <svg class="toast-ring" width="22" height="22" viewBox="0 0 22 22">
        <circle cx="11" cy="11" r="9" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="2.5"/>
        <circle class="toast-ring-arc" cx="11" cy="11" r="9" fill="none"
          stroke="rgba(255,255,255,0.55)" stroke-width="2.5" stroke-linecap="round"
          stroke-dasharray="56.5" stroke-dashoffset="0"
          transform="rotate(-90 11 11)"/>
      </svg>
    </div>
    <div class="toast-body" id="toastBody"></div>
    <div class="toast-hint" id="toastHint">Tap for explanation →</div>
  </div>

  <!-- Fact sheet (bottom sheet, always present) -->
  <div class="fact-modal" id="factModal">
    <div class="fact-backdrop" onclick="closeFactModal()"></div>
    <div class="fact-sheet">
      <div class="fact-handle"></div>
      <div class="fact-sheet-top">
        <div>
          <div class="fact-domain" id="factModalDomain"></div>
          <div class="fact-heading">Explanation</div>
        </div>
        <button class="fact-star-btn" id="factStarBtn" onclick="toggleFavourite(event)">☆</button>
      </div>
      <div class="fact-question" id="factModalQ"></div>
      <div id="factModalEx"></div>
      <button class="fact-close-btn" onclick="closeFactModal()">← Back to game</button>
    </div>
  </div>

  <!-- Theorie-modal (bottom sheet, always present) -->
  <div class="theory-overlay" id="theoryOverlay">
    <div class="theory-backdrop" onclick="closeTheory()"></div>
    <div class="theory-sheet">
      <div class="theory-handle"></div>
      <div class="theory-header">
        <div class="theory-header-left">
          <span class="theory-icon-wrap" id="theoryIcon">📖</span>
          <div>
            <div class="theory-eyebrow">Theory book</div>
            <div class="theory-title" id="theoryTitle">Title</div>
            <div class="theory-subtitle" id="theorySubtitle"></div>
          </div>
        </div>
        <button class="theory-close-btn" onclick="closeTheory()">✕</button>
      </div>
      <div class="theory-body" id="theoryBody"></div>
    </div>
  </div>

  <!-- Rank-up celebration -->
  <div class="rankup-overlay" id="rankupOverlay">
    <div class="rankup-icon" id="rankupIcon">⭐</div>
    <div class="rankup-sub">New rank reached!</div>
    <div class="rankup-label" id="rankupLabel">Resident</div>
  </div>

  <!-- Achievement unlock banner (slides in from top) -->
  <div class="ach-banner" id="achBanner">
    <span class="ach-banner-trophy">🏆</span>
    <div class="ach-banner-body">
      <div class="ach-banner-top">Achievement unlocked!</div>
      <div class="ach-banner-row">
        <span id="achBannerIcon">🎯</span>
        <span id="achBannerLabel"></span>
      </div>
    </div>
  </div>

  <div class="combo-burst" id="comboBurst">
    <div class="combo-num" id="comboNum"></div>
    <div class="combo-label" id="comboLabel"></div>
  </div>

  <!-- Storage adapter + state helpers — load before i18n so any future
       state read goes through MDStorage / MDState. Pure additions; existing
       localStorage callers continue to work unchanged. -->
  <script src="src/api/storage.js"></script>
  <script src="src/api/state.js"></script>

  <!-- i18n — must load first -->
  <script src="src/i18n.js"></script>

  <!-- Data -->
  <script src="src/data/questions.js"></script>
  <script src="src/data/cases.js"></script>
  <script src="src/data/detective_cases.js"></script>

  <!-- Modules -->
  <script src="src/ui.js"></script>
  <script src="src/game.js"></script>
  <script src="src/spoedkamer.js"></script>
  <script src="src/dossier.js"></script>
  <script src="src/daily.js"></script>
  <script src="src/favourites.js"></script>
  <script src="src/learn.js"></script>
  <script src="src/weak.js"></script>
  <script src="src/spaced.js"></script>
  <script src="src/onboarding.js"></script>
  <script src="src/theory.js"></script>
  <script src="src/detective.js"></script>
  <script src="src/admin.js"></script>
  <script src="src/router.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js');
    }
    // Apply i18n to static HTML elements
    document.addEventListener('DOMContentLoaded', () => {
      const th = document.getElementById('toastHint');
      if (th) th.textContent = t('tap_explain');
      const fh = document.querySelector('.fact-heading');
      if (fh) fh.textContent = t('explanation');
      const fb = document.querySelector('.fact-close-btn');
      if (fb) fb.textContent = t('back_game');
      const te = document.querySelector('.theory-eyebrow');
      if (te) te.textContent = t('theory_book');
      const ru = document.querySelector('.rankup-sub');
      if (ru) ru.textContent = getLang() === 'nl' ? 'Nieuwe rang bereikt!' : 'New rank reached!';
      const ab = document.querySelector('.ach-banner-top');
      if (ab) ab.textContent = getLang() === 'nl' ? 'Prestatie ontgrendeld!' : 'Achievement unlocked!';
    });
  </script>

</body>
</html>
